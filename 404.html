<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Xiimo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .error-wrap {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2.5rem;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--c-forest-muted);
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
    }
    .error-title {
      font-family: var(--font-brand);
      font-size: clamp(2.25rem, 4.5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c-forest-deep);
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--c-text-secondary);
      max-width: 460px;
      margin-bottom: 2.25rem;
      line-height: 1.65;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner container">
      <a href="/" class="brand" aria-label="Xiimo home">
        <span class="brand-monogram">
          <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="6" fill="#0c251b"/>
            <path d="M7 7L14 14M14 14L21 21M14 14L21 7M14 14L7 21" stroke="#9ee3be" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-wordmark">xiimo</span>
      </a>
      <a href="/" class="nav-cta">&larr; Return Home</a>
    </div>
  </header>

  <main class="container error-wrap">
    <div class="error-code">404 // Route Not Located</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested resource is unavailable or has moved to an updated route.</p>
    <a href="/" class="btn btn-dark">Return to Studio Overview</a>
  </main>
</body>
</html>
